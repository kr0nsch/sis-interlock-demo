# Обоснованные находки iec_checker (tools/check/run_iec_checker.py).
# Обоснованная находка попадает в отчёт со статусом allowed и не роняет проверку.
# Подробный разбор каждой записи — docs/STATIC_ANALYSIS.md; при изменении кода держите их согласованными.
#
# Ключи записи [[allow]]:
#   id     — идентификатор правила iec_checker (шаблон fnmatch), например "PLCOPEN-CP3";
#   file   — шаблон fnmatch пути исходника (src/POUs/...) или имени собранного файла (FB_X.st);
#            '*' захватывает и '/';
#   match  — необязательно: регулярное выражение по тексту сообщения;
#   reason — обязательно: почему находка допустима;
#   checker — необязательно: "v0.4" (обязательная проверка, бинарник) или "nightly" (необязательное
#            задание CI, Docker-образ, закреплённый по дайджесту в ci.yml). Запись с этим ключом
#            применяется и проверяется на использование только при прогоне своей версией.
# ParserError и LexingError обосновать нельзя: их исправляют в коде или в понижении iec-checker.
# С --tests (v0.4) используется каждая запись, кроме checker = "nightly" (проверяет pytest:
# test_run_iec_checker.py::test_integration_repository_sources). Записи для образа nightly — в последнем
# разделе: их пересматривают вместе с дайджестом образа.

[[allow]]
id = "PLCOPEN-CP3"
file = "src/*"
reason = "Переменная без явного начального значения получает значение по умолчанию своего типа (МЭК 61131-3, как в CODESYS); вариант сборки iec-checker убирает неконстантные начальные значения"

[[allow]]
id = "PLCOPEN-CP3"
file = "tests/*"
reason = "Как для src/: значения по умолчанию типов; результаты тестов присваиваются до чтения"

[[allow]]
id = "PLCOPEN-CP9"
file = "tests/*"
reason = "Наборы тестов — последовательные вызовы без ветвлений (классическая сложность — 1); завышенный подсчёт iec_checker 0.4, метрика для тестов не показательна"

# =====================================================================================================
# Логика ПАЗ (src/POUs/Sis/, PRG_Main) и тесты, написанные вручную, и таблицы истинности —
# раздел команды A (DESIGN.md, 13.1). Пути не пересекаются с разделом команды B ниже: каждое
# обоснование используется ровно своими файлами. Разбор — docs/STATIC_ANALYSIS.md, раздел «Логика ПАЗ».
# =====================================================================================================

[[allow]]
id = "PLCOPEN-CP9"
file = "src/POUs/Sis/*"
match = "Code is too complex"
reason = "Тела FB_Voting, FB_CauseEffect, FB_SisUnit, F_VoteEval, F_VoteCheckCfg, F_CemCheckCfg — нормативная последовательность шагов контракта (DESIGN.md 5.2, 5.5, 5.9, 6.3, 6.8, 8.1) с пронумерованными шагами; деление на методы спрятало бы порядок событий. iec_checker 0.4 считает каждое логическое выражение и каждую ветвь вложенных циклов, метрика завышена; поведение покрыто граничными тестами и исчерпывающими таблицами истинности (docs/STATIC_ANALYSIS.md)"

[[allow]]
id = "PLCOPEN-L17"
file = "src/POUs/Sis/*"
reason = "IF без ELSE — у условия нет действия «иначе» (событие по смене состояния, бит ошибки конфигурации, счётчик); пустая ветвь ELSE только добавила бы шум (как в plc-process-lib)"

[[allow]]
id = "PLCOPEN-L17"
file = "tests/POUs/Helpers/FB_SisTestLog/*"
reason = "Поиск событий по виду: запись не того вида пропускается — действия «иначе» нет"

[[allow]]
id = "PLCOPEN-L17"
file = "tests/POUs/TruthTables/FB_VoteTableRig/*"
reason = "Сборка байта результата по битам: бит не установлен — действия нет"

[[allow]]
id = "PLCOPEN-L17"
file = "src/POUs/PRG_Main/*"
reason = "Нормальные значения входов ставятся только в первом цикле демо без ввода-вывода (DESIGN.md 8.4): действия «иначе» нет"

[[allow]]
id = "UnusedVariable"
file = "src/POUs/Sis/*"
match = "variable: (AFB|FB|ST|AST)[A-Z0-9]*$"
reason = "Ложное срабатывание iec_checker 0.4: экземпляры ФБ используются вызовом (fbDisc(...), afbBypass[k](...)) и чтением выходов, структуры — обращением к полям (stCfg.eArch, stSts.xTrip), массив кольца — в методах; это он не считает использованием"

[[allow]]
id = "UnusedVariable"
file = "src/POUs/Sis/FB_SisEventLog/FB_SisEventLog.decl.st"
match = "variable: (UINEXT|UIUSED|UDISEQ)$"
reason = "Переменные журнала используются только в методах AddEvent, GetEvent, Clear и свойствах; понижение iec-checker выносит методы в отдельные функции, и в теле ФБ (оно пустое) переменные не видны"

[[allow]]
id = "UnusedVariable"
file = "src/POUs/Sis/F_SisCrc16Byte/F_SisCrc16Byte.decl.st"
match = "variable: BDATA$"
reason = "Ложное срабатывание iec_checker 0.4: bData — аргумент вложенного вызова SHL(BYTE_TO_WORD(bData), ...), такой аргумент он не считает использованием"

[[allow]]
id = "UnusedVariable"
file = "src/POUs/Sis/F_VoteEval/F_VoteEval.decl.st"
match = "variable: EARCH$"
reason = "Ложное срабатывание iec_checker 0.4: eArch передаётся в F_VoteArchChannels(eArch := eArch) и F_VoteArchRequired(eArch := eArch); присваивание формальному параметру с тем же именем он принимает за сам параметр"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/Suites/*"
match = "variable: ((FB|ST|AST|AFB)[A-Z0-9]*|U(BAD|BITS|NAN|PLUS|MINUS)|WMASK)$"
reason = "Ложное срабатывание iec_checker 0.4: стенды и ФБ под тестом используются вызовом методов и чтением выходов (fbRig.Cycle(), fbRig.fbVote.xTrip), структуры и объединения — обращением к полям (uBad.ePolicy, uBits.rValue), wMask — аргументом SIZEOF; это он не считает использованием"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/Helpers/FB_*Rig/*"
match = "variable: ((FB|ST|AST|AX)[A-Z0-9]*|XBYPASSPERMIT|XOVERRIDEPERMIT|XRESETHW|UICAUSE|UICH|UIEFFECT)$"
reason = "Переменные стендов используются только в их методах (Cycle, Step, Out, BypassOf, StateOf), которые понижение iec-checker выносит в функции; uiCh и uiEffect — индексы массивов, переменные индексов iec_checker 0.4 использованием не считает"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/TruthTables/*"
match = "variable: (FB|ST)[A-Z0-9]*$"
reason = "Сгенерированные таблицы истинности: стенд fbRig используется вызовом методов (fbRig.EvalRow(...)), переменные стенда FB_VoteTableRig — в его методах, которые понижение выносит в функции"

